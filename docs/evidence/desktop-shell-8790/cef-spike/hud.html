<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#hud{position:absolute;left:12px;top:12px;font:16px sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:4px}
#btn{position:absolute;left:100px;top:100px;width:160px;height:40px}
#ping{position:absolute;right:12px;top:12px;font:16px monospace;color:#ff0}
</style></head>
<body>
<div id="hud">HUD <span id="fps">-</span></div>
<button id="btn">Menu</button>
<div id="ping">ping 0</div>
<script>
let raf = 0, t0 = performance.now();
document.addEventListener('pointerdown', e => { document.title = 'pointerdown:' + e.target.id + ':' + e.clientX + ',' + e.clientY; });
document.getElementById('btn').addEventListener('click', () => { document.getElementById('btn').textContent = 'Clicked'; });
document.addEventListener('keydown', e => { document.title = 'keydown:' + e.code + ':' + e.key; });
function tick() {
  raf++;
  const t = performance.now();
  if (t - t0 >= 1000) { document.getElementById('fps').textContent = raf + ' raf/s'; raf = 0; t0 = t; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
