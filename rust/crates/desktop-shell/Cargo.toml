[package]
name = "desktop-shell"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
render-wgpu.workspace = true
# The window mode a product and its players choose.
render-model.workspace = true
# The gameplay facts the window hands the runtime while it holds the lock.
runtime-input.workspace = true
# Only this crate may depend on winit (scripts/dependency_boundary_check.py).
winit = "0.30"
# Gamepads, read by the window while it holds gameplay input. Only this crate
# may depend on gilrs (scripts/dependency_boundary_check.py).
gilrs = { version = "0.11", optional = true }

[features]
# The product UI over the scene, through either web engine. Off by default.
ui-overlay = ["dep:gilrs"]
# Chromium off-screen rendering: its build downloads CEF (see
# docs/desktop-shell.md).
web-overlay = ["ui-overlay", "render-wgpu/web-overlay"]
# Servo in this process.
servo-overlay = ["ui-overlay", "render-wgpu/servo-overlay"]

[dev-dependencies]
render-host-contracts.workspace = true

[[example]]
name = "shell_demo"
required-features = ["ui-overlay"]
