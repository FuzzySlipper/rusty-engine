[package]
name = "render-wgpu"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
render-model.workspace = true
render-host-contracts.workspace = true
render-presentation.workspace = true
render-video.workspace = true
# Only this crate may depend on wgpu (scripts/dependency_boundary_check.py).
wgpu = { version = "30.0.1", features = ["naga-ir"] }
# The standard shader's WGSL modules (`src/shaders`): #import and #ifdef.
naga_oil = { version = "0.23", default-features = false }
glam.workspace = true
png.workspace = true
jpeg-decoder = { version = "0.3.2", default-features = false }
# Animated mesh GLBs (the runtime admits them; this crate only reads them).
gltf = { workspace = true, features = ["extensions"] }
bytemuck.workspace = true
pollster.workspace = true
# Billboard labels (#8827): glyph rasterizing and WOFF2 font decoding.
fontdue = "0.9.4"
wuff = "0.2.9"
# The desktop shell's UI overlay: Chromium (CEF) off-screen rendering imported
# into this crate's device. Off by default: its build downloads CEF.
welding = { version = "=0.14.1", default-features = false, features = ["wgpu-30", "cef-runtime"], optional = true }
dpi = { version = "0.1.2", optional = true }

[features]
web-overlay = ["dep:welding", "dep:dpi"]

[dev-dependencies]
jpeg-encoder = { version = "0.6", features = ["simd"] }
# Voxel scene fixtures: real chunk payloads from the scene projector.
render-projection.workspace = true
engine-spatial.workspace = true
# Animated fixtures: GLBs admitted exactly as the runtime admits them.
asset-import.workspace = true
serde_json.workspace = true
serde.workspace = true
# Window for the surface presentation example only; the desktop shell owns
# the real window.
winit = "0.30"
