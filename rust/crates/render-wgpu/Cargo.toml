[package]
name = "render-wgpu"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
render-model.workspace = true
# The pose evaluator, shared with simulation-time sampling.
animation-pose.workspace = true
render-host-contracts.workspace = true
render-presentation.workspace = true
render-video.workspace = true
# Only this crate may depend on wgpu (scripts/dependency_boundary_check.py).
# No DX12: Windows draws with Vulkan (docs/desktop-shell.md).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "gles", "wgsl", "naga-ir"] }
# The standard shader family, composed into the modules pipelines take.
render-shaders.workspace = true
glam.workspace = true
png.workspace = true
jpeg-decoder = { version = "0.3.2", default-features = false }
# GLB EXT_texture_webp images.
image-webp = "0.2.4"
# Tangents for normal-mapped GLB primitives that do not carry them.
bevy_mikktspace = "1.0.0"
# Animated mesh GLBs (the runtime admits them; this crate only reads them).
gltf = { workspace = true, features = ["extensions"] }
bytemuck.workspace = true
pollster.workspace = true
# Billboard labels (#8827): glyph rasterizing and WOFF2 font decoding.
fontdue = "0.9.4"
wuff = "0.2.9"
# The desktop shell's UI overlay: a web engine's frames imported into this
# crate's device. Chromium (CEF, `web-overlay`) renders off-screen; its build
# downloads CEF. Servo (`servo-overlay`) draws with GL into buffers shared
# with this device (`welding`'s GL target).
welding = { version = "=0.15.0", default-features = false, features = ["wgpu-30"], optional = true }
dpi = { version = "0.1.2", optional = true }
servo = { version = "=0.7.0", features = ["webcrypto", "gamepad"], optional = true }
# Servo's rendering-context trait names these GL and surface types.
gleam = { version = "0.15.1", optional = true }
glow = { version = "0.17.0", optional = true }
surfman = { version = "0.14.0", default-features = false, optional = true }
euclid = { version = "0.22", optional = true }
url = { version = "2", optional = true }
# Servo's network stack takes rustls's process default provider, which rustls
# cannot pick once the host links both of its providers.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# NVIDIA DLSS as a temporal upscale stage (`dlss.rs`). Off by default: its
# build needs NVIDIA's DLSS SDK, the Vulkan headers and clang
# (docs/lighting-and-sky.md#dlss).
dlss_wgpu = { version = "=6.0.0", optional = true }
uuid = { version = "1", default-features = false, optional = true }

[features]
# Either UI engine: the frame import and the composite over the scene.
ui-overlay = ["dep:welding", "dep:dpi"]
web-overlay = ["ui-overlay", "welding/cef-runtime"]
servo-overlay = [
    "ui-overlay",
    "welding/gl-target",
    "dep:servo",
    "dep:gleam",
    "dep:glow",
    "dep:surfman",
    "dep:euclid",
    "dep:url",
    "dep:rustls",
]
dlss = ["dep:dlss_wgpu", "dep:uuid"]

[dev-dependencies]
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Voxel scene fixtures: real chunk payloads from the scene projector.
render-projection.workspace = true
engine-spatial.workspace = true
# Heightfield fixtures: tiles meshed and kept as the services keep them.
svc-mesh.workspace = true
# Animated fixtures: GLBs admitted exactly as the runtime admits them.
asset-import.workspace = true
serde_json.workspace = true
serde.workspace = true
# Window for the surface presentation example only; the desktop shell owns
# the real window.
winit = "0.30"
