[package]
name = "product-host"
version.workspace = true
edition.workspace = true

[dependencies]
render-model.workspace = true
render-host-contracts.workspace = true
render-presentation.workspace = true
runtime-lifecycle.workspace = true
runtime-input.workspace = true
runtime-diagnostics.workspace = true
runtime-ui.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
ts-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# Denied rather than forbidden: the scheduler sets its thread's priority
# through the Windows API in one allowed function (src/lib.rs).
[lints.rust]
unsafe_code = "deny"
