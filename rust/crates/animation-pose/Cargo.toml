[package]
name = "animation-pose"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
render-model.workspace = true
render-presentation.workspace = true
# The pose evaluator's math (scripts/dependency_boundary_check.py); values
# leave this crate as Engine arrays and transforms.
glam.workspace = true
# Animated mesh and clip-pack GLBs (the runtime admits them; this reads them).
gltf = { workspace = true, features = ["extensions"] }

[dev-dependencies]
# Fixture GLBs admitted exactly as the runtime admits them.
asset-import.workspace = true
