[package]
name = "csharp-product-runtime"
version.workspace = true
edition.workspace = true

[[bin]]
# The historic Cargo target remains available for source-tree development.
# Runtime packs use this deliberately generic host identity instead.
name = "rusty-product-host"
path = "src/main.rs"

[dependencies]
libloading = "0.9"
netcorehost = { version = "=0.22.0", default-features = false, features = ["nethost-download", "net10_0"] }
serde_json.workspace = true
serde.workspace = true
csharp-engine-abi.workspace = true
csharp-engine-services.workspace = true
product-host.workspace = true
render-audio.workspace = true
render-stream.workspace = true
# The runtime's renderer (SceneDriver), and RenderOutput image capture and
# GLB export (#8826).
render-wgpu.workspace = true
product-container.workspace = true
render-export.workspace = true
render-host-contracts.workspace = true
render-presentation.workspace = true
render-model.workspace = true
render-verify.workspace = true
runtime-input.workspace = true
runtime-lifecycle.workspace = true
runtime-ui.workspace = true
desktop-shell = { workspace = true, optional = true }

[features]
# The desktop shell: a native window with the product UI through Chromium.
# Off by default; its build downloads CEF (see docs/desktop-shell.md).
desktop = ["dep:desktop-shell", "desktop-shell/web-overlay"]
# Servo as the window's other UI engine (`renderer.windowUi = servo`).
servo = ["desktop", "desktop-shell/servo-overlay"]
# NVIDIA DLSS as a temporal upscale stage. Off by default: its build needs
# NVIDIA's DLSS SDK (docs/lighting-and-sky.md#dlss).
dlss = ["render-wgpu/dlss"]

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile.workspace = true
