<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rusty Product Host</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #11151d; color: #e6edf3; font: 16px system-ui, sans-serif; }
      #application { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="application"></div>
    <!--
      The runtime pack owns these optional UI-only modules: the diagnostics
      panel and the video options panel. Products can import the stable names
      without staging Engine browser artifacts or discovering an Engine
      checkout. Mounting remains product opt-in.
    -->
    <script type="importmap">
      {
        "imports": {
          "@rusty-engine/live-debug": "./engine/live-debug-panel/index.js",
          "@rusty-engine/video-options": "./engine/video-options/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
