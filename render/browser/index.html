<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Rusty Engine renderer browser acceptance</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; background: #101820; color: white; }
      #game-host { position: relative; width: 800px; height: 450px; }
      canvas { display: block; width: 800px; height: 450px; }
      #overlays { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      #inspection { width: 400px; height: 240px; }
      #enable-audio { margin: 8px; }
    </style>
  </head>
  <body>
    <div id="game-host">
      <canvas id="renderer" width="800" height="450"></canvas>
      <div id="overlays"></div>
    </div>
    <button id="enable-audio" type="button">Enable audio</button>
    <canvas id="inspection" width="400" height="240"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
