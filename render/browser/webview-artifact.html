<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust-only renderer artifact acceptance</title>
    <style>
      html, body, #rusty-renderer-root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #rusty-renderer-root { position: relative; }
      #rusty-renderer-canvas { display: block; width: 100%; height: 100%; }
      #rusty-renderer-overlays { position: absolute; inset: 0; pointer-events: none; }
    </style>
    <script>
      window.__rustyWebviewMessages = [];
      const trackedListenerTypes = new Set([
        'blur', 'keydown', 'keyup', 'pointerdown', 'pointermove', 'pointerup', 'wheel',
      ]);
      const trackedListeners = new Map();
      const nativeAddEventListener = window.addEventListener.bind(window);
      const nativeRemoveEventListener = window.removeEventListener.bind(window);
      window.addEventListener = (type, listener, options) => {
        if (trackedListenerTypes.has(type)) {
          const listeners = trackedListeners.get(type) ?? new Set();
          listeners.add(listener);
          trackedListeners.set(type, listeners);
        }
        nativeAddEventListener(type, listener, options);
      };
      window.removeEventListener = (type, listener, options) => {
        trackedListeners.get(type)?.delete(listener);
        nativeRemoveEventListener(type, listener, options);
      };
      window.__rustyTrackedListenerCounts = () => Object.fromEntries(
        [...trackedListenerTypes].map((type) => [type, trackedListeners.get(type)?.size ?? 0]),
      );
      window.__rustyEngineRendererConfiguration = {
        autoStart: false,
        clearColor: 1056816,
        pixelRatio: 1,
        resources: [],
      };
      window.ipc = {
        postMessage(message) {
          window.__rustyWebviewMessages.push(JSON.parse(message));
        },
      };
      if (new URLSearchParams(window.location.search).get('mountFailure') === 'audio') {
        Object.defineProperty(window, 'AudioContext', {
          configurable: true,
          value: class ForcedAudioContextFailure {
            constructor() {
              throw new Error('forced late audio host failure');
            }
          },
        });
      }
    </script>
  </head>
  <body>
    <div id="rusty-renderer-root">
      <canvas id="rusty-renderer-canvas" width="320" height="240"></canvas>
      <div id="rusty-renderer-overlays"></div>
    </div>
    <script type="module" src="./webview-artifact.ts"></script>
  </body>
</html>
