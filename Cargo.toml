[workspace]
resolver = "2"
members = [
    "rust/crates/asset-import",
    "rust/crates/authored-scene",
    "rust/crates/asset-catalog",
    "rust/crates/content-store",
    "rust/crates/environment-authoring",
    "rust/crates/engine-inspector",
    "rust/crates/gameplay-mechanics",
    "rust/crates/gameplay-rules",
    "rust/crates/render-model",
    "rust/crates/render-presentation",
    "rust/crates/render-projection",
    "rust/crates/state-machine",
    "rust/crates/engine-spatial",
    "rust/crates/entity-state",
    "rust/crates/voxel-asset",
    "rust/crates/voxel-annotation",
    "rust/crates/voxel-convert",
    "rust/crates/voxel-object-runtime",
    "rust/crates/core-assets",
    "rust/crates/core-ids",
    "rust/crates/core-math",
    "rust/crates/core-space",
    "rust/crates/core-time",
    "rust/crates/core-voxel",
    "rust/crates/svc-collision",
    "rust/crates/svc-mesh",
    "rust/crates/svc-pathfinding",
    "rust/crates/svc-rng",
    "rust/crates/svc-spatial",
    "rust/crates/svc-volume",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
asset-import = { path = "rust/crates/asset-import" }
voxel-convert = { path = "rust/crates/voxel-convert" }
authored-scene = { path = "rust/crates/authored-scene" }
asset-catalog = { path = "rust/crates/asset-catalog" }
content-store = { path = "rust/crates/content-store" }
environment-authoring = { path = "rust/crates/environment-authoring" }
engine-inspector = { path = "rust/crates/engine-inspector" }
engine-spatial = { path = "rust/crates/engine-spatial" }
gameplay-mechanics = { path = "rust/crates/gameplay-mechanics" }
gameplay-rules = { path = "rust/crates/gameplay-rules" }
render-model = { path = "rust/crates/render-model" }
render-presentation = { path = "rust/crates/render-presentation" }
render-projection = { path = "rust/crates/render-projection" }
state-machine = { path = "rust/crates/state-machine" }
entity-state = { path = "rust/crates/entity-state" }
voxel-asset = { path = "rust/crates/voxel-asset" }
voxel-annotation = { path = "rust/crates/voxel-annotation" }
voxel-object-runtime = { path = "rust/crates/voxel-object-runtime" }
core-assets = { path = "rust/crates/core-assets" }
core-ids = { path = "rust/crates/core-ids" }
core-math = { path = "rust/crates/core-math" }
core-space = { path = "rust/crates/core-space" }
core-time = { path = "rust/crates/core-time" }
core-voxel = { path = "rust/crates/core-voxel" }
svc-collision = { path = "rust/crates/svc-collision" }
svc-pathfinding = { path = "rust/crates/svc-pathfinding" }
svc-rng = { path = "rust/crates/svc-rng" }
svc-mesh = { path = "rust/crates/svc-mesh" }
svc-spatial = { path = "rust/crates/svc-spatial" }
svc-volume = { path = "rust/crates/svc-volume" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
stats_alloc = "0.1.10"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }

[workspace.lints.rust]
unsafe_code = "forbid"
