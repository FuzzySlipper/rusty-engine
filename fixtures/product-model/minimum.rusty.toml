[product]
id = "example.product"

[runtime_composition]
entrypoints = ["rules/main.ts"]

[lifecycle]
mode = "realtime"

[lifecycle.realtime]
fixed_step_hz = 60
max_catch_up_steps = 4

[kernel]
entry = "kernel/lib.rs"

[ui]
entry = "ui/main.ts"

[content]
root = "content"

[outputs]
compiled_composition = "generated/compiled-composition.json"
admitted_runtime_content = "generated/runtime-content"
product_assembly = "generated/product-assembly"
product_bundle = "generated/product-bundle"

[[wrappers]]
id = "desktop"
kind = "tauri"
application_id = "com.example.product"
title = "Example Product"
window_width = 1280
window_height = 720
resizable = true
permissions = ["window", "storage"]
storage_namespace = "example.product"
release_channel = "development"
