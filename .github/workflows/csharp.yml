name: csharp

on:
  push:
    branches: [main]
    paths:
      - 'csharp/**'
      - 'fixtures/csharp-*/**'
      - 'rust/crates/csharp-engine-abi/**'
      - 'rust/crates/csharp-engine-services/**'
      - 'rust/crates/engine-spatial/**'
      - 'rust/crates/svc-collision/**'
      - 'rust/crates/csharp-product-runtime/**'
      - 'rust/crates/render-audio/**'
      - '.config/dotnet-tools.json'
      - 'scripts/generate-csharp-native-bindings.sh'
      - 'scripts/test-csharp-binding-generator-results-fixture.sh'
      - 'scripts/verify-csharp*.sh'
      - 'scripts/pack-csharp-sdk.sh'
      - 'scripts/test-csharp-sdk-package.sh'
      - 'scripts/fixtures/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - 'fixtures/csharp-*/**'
      - 'rust/crates/csharp-engine-abi/**'
      - 'rust/crates/csharp-engine-services/**'
      - 'rust/crates/engine-spatial/**'
      - 'rust/crates/svc-collision/**'
      - 'rust/crates/csharp-product-runtime/**'
      - 'rust/crates/render-audio/**'
      - '.config/dotnet-tools.json'
      - 'scripts/generate-csharp-native-bindings.sh'
      - 'scripts/test-csharp-binding-generator-results-fixture.sh'
      - 'scripts/verify-csharp*.sh'
      - 'scripts/pack-csharp-sdk.sh'
      - 'scripts/test-csharp-sdk-package.sh'
      - 'scripts/fixtures/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:
    inputs:
      nativeaot:
        description: Also run the explicit NativeAOT fidelity exercise
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Rust verification builds the complete dependency/test graph.
          # Read its cache without letting this faster, smaller job replace it.
          shared-key: engine-ci-complete
          save-if: false
          workspaces: . -> target

      - name: Read the binding tool version
        id: cbindgen
        run: echo "version=$(sed -n 's/^cbindgen_version=//p' scripts/generate-csharp-native-bindings.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore the binding tool
        uses: actions/cache@v4
        with:
          path: ~/.cache/rusty-engine/tools/cbindgen-${{ steps.cbindgen.outputs.version }}
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.cbindgen.outputs.version }}

      - name: Install C# verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev jq unzip ripgrep libasound2-dev
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang_path"
          echo "LD_LIBRARY_PATH=$(dirname "$libclang_path")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify packaged C# SDK and CoreCLR lifecycle
        run: ./scripts/verify-csharp.sh

      - name: Verify NativeAOT fidelity on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nativeaot }}
        run: ./scripts/verify-csharp.sh --aot
