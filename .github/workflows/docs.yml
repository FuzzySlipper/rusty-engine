name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/check-ci-routing.py'
      - 'scripts/check-doc-links.sh'
      - 'scripts/test-ci-routing-checker.sh'
      - 'scripts/verify-docs.sh'
      - 'scripts/requirements-ci.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/check-ci-routing.py'
      - 'scripts/check-doc-links.sh'
      - 'scripts/test-ci-routing-checker.sh'
      - 'scripts/verify-docs.sh'
      - 'scripts/requirements-ci.txt'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-docs-and-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Verify documentation and CI routing
        # The routing checker reads Actions YAML, including its `on` key.
        # Use the parser rather than maintaining a formatting-sensitive subset.
        run: |
          python3 -m pip install --user -r scripts/requirements-ci.txt
          ./scripts/verify-docs.sh
