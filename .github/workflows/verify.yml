name: verify

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-ci
          workspaces: . -> target

      - name: Install architecture audit dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify
        run: ./scripts/verify.sh
