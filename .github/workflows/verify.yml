name: verify

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'render/packages/*/src/generated/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'render/packages/*/src/generated/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-ci
          workspaces: . -> target

      - name: Install architecture audit dependency
        # mesa-vulkan-drivers supplies llvmpipe (lavapipe), the software Vulkan
        # adapter the render-wgpu screenshot tests run on. The GTK/WebKit
        # headers build desktop-shell's overlay-spike dev-dependencies (wry,
        # gtk) under `cargo test --workspace` (#8790, #8857).
        run: sudo apt-get update && sudo apt-get install --yes ripgrep libasound2-dev mesa-vulkan-drivers libvulkan1 libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Verify
        env:
          WGPU_BACKEND: vulkan
        run: ./scripts/verify.sh
