name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'studio/**'
  pull_request:
    paths-ignore:
      - 'studio/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            ripgrep

      - name: Verify
        run: ./scripts/verify.sh
