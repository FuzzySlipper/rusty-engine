name: verify

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/artifacts/**'
      - 'content/**'
      - 'fixtures/**'
      - 'migration/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/audit-render-isolation.sh'
      - 'scripts/audit-studio-isolation.sh'
      - 'scripts/check-asha-equivalence.sh'
      - 'scripts/check-gameplay-mechanics-donor-disposition.sh'
      - 'scripts/check-gameplay-rules-donor-disposition.sh'
      - 'scripts/check-render-completeness.sh'
      - 'scripts/check-rust-sdk-coverage.py'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/test-asha-equivalence-checker.sh'
      - 'scripts/test-render-completeness-checker.sh'
      - 'scripts/test_rust_sdk_checks.py'
      - 'scripts/verify-rust-sdk-consumer.sh'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/artifacts/**'
      - 'content/**'
      - 'fixtures/**'
      - 'migration/**'
      - 'scripts/audit-standalone.sh'
      - 'scripts/audit-render-isolation.sh'
      - 'scripts/audit-studio-isolation.sh'
      - 'scripts/check-asha-equivalence.sh'
      - 'scripts/check-gameplay-mechanics-donor-disposition.sh'
      - 'scripts/check-gameplay-rules-donor-disposition.sh'
      - 'scripts/check-render-completeness.sh'
      - 'scripts/check-rust-sdk-coverage.py'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/test-asha-equivalence-checker.sh'
      - 'scripts/test-render-completeness-checker.sh'
      - 'scripts/test_rust_sdk_checks.py'
      - 'scripts/verify-rust-sdk-consumer.sh'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-ci
          workspaces: . -> target

      - name: Install Linux webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            ripgrep

      - name: Verify
        run: ./scripts/verify.sh
