name: verify

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/artifacts/**'
      - 'csharp/**'
      - 'fixtures/csharp-*/**'
      - 'rust/crates/csharp-engine-abi/**'
      - 'rust/crates/csharp-engine-services/**'
      - 'rust/crates/csharp-product-runtime/**'
      - '.config/dotnet-tools.json'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/generate-csharp-native-bindings.sh'
      - 'scripts/test-csharp-binding-generator-lease-fixture.sh'
      - 'scripts/verify-csharp.sh'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - '!rust/crates/renderer-webview-host/artifacts/**'
      - 'csharp/**'
      - 'fixtures/csharp-*/**'
      - 'rust/crates/csharp-engine-abi/**'
      - 'rust/crates/csharp-engine-services/**'
      - 'rust/crates/csharp-product-runtime/**'
      - '.config/dotnet-tools.json'
      - 'scripts/audit-standalone.sh'
      - 'scripts/dependency_boundary_check.py'
      - 'scripts/generate-csharp-native-bindings.sh'
      - 'scripts/test-csharp-binding-generator-lease-fixture.sh'
      - 'scripts/verify-csharp.sh'
      - 'scripts/verify.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-ci
          workspaces: . -> target

      - name: Install Linux webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            clang \
            ripgrep

      - name: Verify
        run: ./scripts/verify.sh

      - name: Verify generated C# SDK and NativeAOT fixture
        run: ./scripts/verify-csharp.sh
