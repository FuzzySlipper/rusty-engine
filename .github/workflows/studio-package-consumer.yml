name: studio-package-consumer

on:
  push:
    branches: [main]
    paths:
      - 'studio/libs/**'
      - 'render/packages/**'
      - 'scripts/verify-studio-package-consumer.sh'
      - '.github/workflows/studio-package-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-studio-package-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact public Git Studio package consumption
        run: ./scripts/verify-studio-package-consumer.sh "$GITHUB_SHA"
